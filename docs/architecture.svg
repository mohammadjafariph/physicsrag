<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Segoe UI, system-ui, sans-serif">
  <title>PhysicsRAG architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" rx="16" fill="#0a0d13"/>

  <!-- ================= ANSWER PIPELINE ================= -->
  <text x="40" y="42" fill="#828da3" font-size="13" letter-spacing="2">ANSWER PIPELINE</text>

  <g>
    <rect x="40" y="64" width="150" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="115" y="94" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Web UI</text>
    <text x="115" y="114" text-anchor="middle" fill="#828da3" font-size="12">chat · papers · runs</text>

    <rect x="240" y="64" width="170" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="325" y="94" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">FastAPI</text>
    <text x="325" y="114" text-anchor="middle" fill="#828da3" font-size="12">/api/chat (SSE)</text>

    <rect x="460" y="64" width="230" height="70" rx="12" fill="#121722" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="575" y="94" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Hybrid retrieval</text>
    <text x="575" y="114" text-anchor="middle" fill="#828da3" font-size="12">BM25 + vectors → RRF → rerank</text>

    <rect x="740" y="64" width="200" height="70" rx="12" fill="#121722" stroke="#fbbf24" stroke-opacity="0.35"/>
    <text x="840" y="94" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">LLM</text>
    <text x="840" y="114" text-anchor="middle" fill="#828da3" font-size="12">OpenAI-compatible · Anthropic</text>

    <rect x="990" y="64" width="150" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="1065" y="94" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Cited answer</text>
    <text x="1065" y="114" text-anchor="middle" fill="#828da3" font-size="12">[n] → arXiv source</text>
  </g>

  <g stroke="#4b5b78" stroke-width="1.6">
    <line x1="190" y1="99" x2="236" y2="99" marker-end="url(#arrow)"/>
    <line x1="410" y1="99" x2="456" y2="99" marker-end="url(#arrow)"/>
    <line x1="690" y1="99" x2="736" y2="99" marker-end="url(#arrow)"/>
    <line x1="940" y1="99" x2="986" y2="99" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= LOCAL STORAGE ================= -->
  <text x="40" y="210" fill="#828da3" font-size="13" letter-spacing="2">LOCAL STORAGE — NOTHING LEAVES YOUR MACHINE</text>

  <rect x="40" y="226" width="1100" height="110" rx="14" fill="#0e121b" stroke="#2a3349" stroke-dasharray="6 4"/>
  <g>
    <rect x="80" y="252" width="300" height="58" rx="10" fill="#121722" stroke="#232b3d"/>
    <text x="230" y="277" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">arXiv PDFs + metadata</text>
    <text x="230" y="296" text-anchor="middle" fill="#828da3" font-size="12">data/papers · data/metadata</text>

    <rect x="440" y="252" width="280" height="58" rx="10" fill="#121722" stroke="#232b3d"/>
    <text x="580" y="277" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Chroma vector store</text>
    <text x="580" y="296" text-anchor="middle" fill="#828da3" font-size="12">384-d local embeddings</text>

    <rect x="790" y="252" width="310" height="58" rx="10" fill="#121722" stroke="#232b3d"/>
    <text x="945" y="277" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">SQLite research memory</text>
    <text x="945" y="296" text-anchor="middle" fill="#828da3" font-size="12">topics · cycles · provenance</text>
  </g>

  <line x1="380" y1="281" x2="436" y2="281" stroke="#4b5b78" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- retrieval reads the vector store -->
  <line x1="575" y1="138" x2="575" y2="248" stroke="#4b5b78" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ================= RESEARCH LOOP ================= -->
  <text x="40" y="396" fill="#828da3" font-size="13" letter-spacing="2">AUTONOMOUS RESEARCH LOOP</text>

  <g>
    <rect x="40" y="416" width="170" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="125" y="446" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Topic planner</text>
    <text x="125" y="466" text-anchor="middle" fill="#828da3" font-size="12">LLM → arXiv queries</text>

    <rect x="260" y="416" width="180" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="350" y="446" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">arXiv search</text>
    <text x="350" y="466" text-anchor="middle" fill="#828da3" font-size="12">query relaxation · rate limits</text>

    <rect x="490" y="416" width="230" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="605" y="446" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Download · chunk · embed</text>
    <text x="605" y="466" text-anchor="middle" fill="#828da3" font-size="12">typographic section chunking</text>

    <rect x="770" y="416" width="180" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="860" y="446" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Analyze evidence</text>
    <text x="860" y="466" text-anchor="middle" fill="#828da3" font-size="12">findings · gaps · candidates</text>

    <rect x="1000" y="416" width="140" height="70" rx="12" fill="#121722" stroke="#232b3d"/>
    <text x="1070" y="446" text-anchor="middle" fill="#d9dee8" font-size="15" font-weight="600">Dedup</text>
    <text x="1070" y="466" text-anchor="middle" fill="#828da3" font-size="12">novel next topic</text>
  </g>

  <g stroke="#4b5b78" stroke-width="1.6">
    <line x1="210" y1="451" x2="256" y2="451" marker-end="url(#arrow)"/>
    <line x1="440" y1="451" x2="486" y2="451" marker-end="url(#arrow)"/>
    <line x1="720" y1="451" x2="766" y2="451" marker-end="url(#arrow)"/>
    <line x1="950" y1="451" x2="996" y2="451" marker-end="url(#arrow)"/>
  </g>

  <!-- loop writes into storage -->
  <line x1="605" y1="412" x2="605" y2="340" stroke="#4b5b78" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- analyzer reads storage -->
  <line x1="860" y1="340" x2="860" y2="412" stroke="#4b5b78" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- next-topic loop back -->
  <path d="M 1070 486 L 1070 560 L 125 560 L 125 492" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="590" y="582" text-anchor="middle" fill="#fbbf24" font-size="13">next topic (loop breaker: embeddings + LLM judge)</text>
</svg>
